<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필 | Profile</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Noto Sans KR) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-gray-100 to-slate-200 text-slate-800 min-h-screen flex items-center justify-center p-4 sm:p-6">

    <main class="w-full max-w-md bg-white/80 backdrop-blur-md rounded-2xl shadow-xl border border-white/60 p-8 sm:p-10 flex flex-col items-center text-center transition-all duration-300 hover:shadow-2xl">
        
        <!-- 1. 프로필 사진 -->
        <div class="relative mb-6">
            <div class="w-32 h-32 sm:w-36 sm:h-36 rounded-full overflow-hidden ring-4 ring-white shadow-md mx-auto">
                <img 
                    src="wiryehumanring.png" 
                    alt="프로필 사진" 
                    class="w-full h-full object-cover"
                    onerror="this.src='https://placehold.co/300x300/e2e8f0/475569?text=Profile'"
                >
            </div>
        </div>

        <!-- 2. 이름 -->
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight mb-2">
            박성열
        </h1>

        <!-- 3. 한 줄 소개 -->
        <p class="text-indigo-600 font-medium text-sm sm:text-base mb-6 px-4 py-1.5 bg-indigo-50 rounded-full inline-block">
            위례 휴먼링과 남한산성에서의 새로운 생활
        </p>

        <!-- 4. 3~4줄 짧은 자기소개 -->
        <div class="w-full pt-4 border-t border-slate-100">
            <p class="text-slate-600 leading-relaxed text-sm sm:text-base text-center break-keep">
                위례 신도시에 위치한 휴먼링은 신도시 시민들의 삶의 형태를 바꾸고 건강한 삶을 유지할 수 있는 기틀이 되고 있습니다.
            </p>
        </div>

    </main>

</body>
</html>
